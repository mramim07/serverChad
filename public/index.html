<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Secure Chat</title>

  <style>
    :root {
      --bg: linear-gradient(135deg, #0f0c1d 0%, #1a1333 100%);
      --card-bg: rgba(30, 25, 50, 0.82);
      --text: #f3edff;
      --text-secondary: #b0a0d0;
      --chat-bg: rgba(12, 10, 28, 0.6);
      --msg-other: rgba(50, 45, 75, 0.8);
      --msg-self: linear-gradient(135deg, #8b5cf6, #c084fc);
      --accent: #a855f7;
      --accent-hover: #d8b4fe;
      --glow: 0 0 20px rgba(168, 85, 247, 0.35);
    }

    [data-theme="light"] {
      --bg: linear-gradient(135deg, #f9f7fd 0%, #e5e0f5 100%);
      --card-bg: rgba(255, 255, 255, 0.94);
      --text: #1a0f2e;
      --text-secondary: #5a4a7a;
      --chat-bg: #f3f0ff;
      --msg-other: #e9e4ff;
      --msg-self: linear-gradient(135deg, #7c3aed, #a78bfa);
      --accent: #7c3aed;
      --accent-hover: #9f7aea;
    }

    [data-theme="dark"] {
      --bg: linear-gradient(135deg, #0a071a 0%, #131027 100%);
      --card-bg: rgba(15, 15, 35, 0.88);
      --text: #e5e0ff;
      --text-secondary: #a0a0c0;
      --chat-bg: #0a071a;
      --msg-other: #1e1b35;
      --msg-self: #5b21b6;
      --accent: #7c3aed;
      --accent-hover: #a78bfa;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.5s ease;
    }

    .container {
      height: 100vh;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(180%);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 50px rgba(0,0,0,0.45);
    }

    /* Login */
    #loginCard {
      padding: 2.4rem 1.8rem;
      margin: 2.5rem auto 1rem;
      width: 92%;
      max-width: 420px;
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    input {
      width: 100%;
      padding: 1.1rem 1.4rem;
      margin: 0.9rem 0;
      border-radius: 14px;
      font-size: 1.05rem;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.07);
      color: var(--text);
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.22);
    }

    .btn {
      width: 100%;
      padding: 1.1rem;
      margin: 0.7rem 0;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }

    .btn-login { background: var(--accent); }
    .btn-login:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--glow); }

    .btn-register { background: rgba(255,255,255,0.12); color: var(--text); }
    .btn-register:hover { background: rgba(255,255,255,0.24); }

    #status {
      text-align: center;
      margin-top: 1.2rem;
      font-weight: 500;
      min-height: 1.4em;
    }

    /* Chat Header */
    .chat-header {
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.38);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    #theme-toggle, #logoutBtn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.13);
      border: none;
      color: var(--text);
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #theme-toggle:hover, #logoutBtn:hover {
      background: rgba(255,255,255,0.25);
    }

    .theme-icon {
      width: 15px;
      height: 15px;
      opacity: 0.9;
    }

    /* Chat content */
    #chatCard {
      display: none;
      height: 100vh;
      border-radius: 0;
      margin: 0;
      background: transparent;
      box-shadow: none;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.3rem 1.1rem;
      background: var(--chat-bg);
    }

    .msg {
      margin: 0.8rem 0;
      padding: 0.95rem 1.35rem;
      border-radius: 1.4rem;
      max-width: 78%;
      font-size: 1.02rem;
      line-height: 1.42;
      backdrop-filter: blur(6px);
    }

    .msg.other {
      background: var(--msg-other);
      border-bottom-left-radius: 0.6rem;
    }

    .msg.self {
      margin-left: auto;
      background: var(--msg-self);
      color: white;
      border-bottom-right-radius: 0.6rem;
    }

    .user { color: #fcd34d; font-weight: 700; margin-right: 0.5rem; }
    .time { font-size: 0.74rem; color: rgba(255,255,255,0.45); margin-left: 0.6rem; }

    .input-area {
      padding: 0.9rem 1rem;
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.07);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.09);
      border-radius: 999px;
      padding: 0.35rem 0.55rem 0.35rem 1.25rem;
      border: 1px solid rgba(255,255,255,0.13);
      height: 50px;
    }

    #msg {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.02rem;
      padding: 0.6rem 0;
      outline: none;
      height: 100%;
      line-height: 1.38;
    }

    #msg::placeholder { color: var(--text-secondary); opacity: 0.65; }

    #sendBtn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 0.7rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    #sendBtn:hover {
      transform: scale(1.08);
      background: var(--accent-hover);
    }

    @media (min-width: 768px) {
      .container { padding: 1rem; }
      #chatCard {
        border-radius: 24px;
        margin: 1rem;
        height: calc(100vh - 2rem);
      }
    }
  </style>
</head>
<body data-theme="default">

<div class="container">

  <!-- Login -->
  <div class="card" id="loginCard">
    <h2>Secure Chat</h2>
    <input id="user" placeholder="Username" autocomplete="off" />
    <input id="pass" type="password" placeholder="Password" autocomplete="off" />
    
    <button class="btn btn-login" onclick="login()">Login</button>
    <button class="btn btn-register" onclick="register()">Register</button>
    
    <div id="status"></div>
  </div>

  <!-- Chat -->
  <div class="card" id="chatCard">
    <div class="chat-header">
      <h2>Chat</h2>
      <div class="header-right">
        <button id="theme-toggle">
          <svg class="theme-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
          </svg>
          <span>Default</span>
        </button>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>

    <div id="chat"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <input id="msg" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn" onclick="send()">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const loginCard = document.getElementById('loginCard');
const chatCard  = document.getElementById('chatCard');
const chatDiv   = document.getElementById('chat');
const msgInput  = document.getElementById('msg');
const statusEl  = document.getElementById('status');

// Theme toggle
const themeToggle = document.getElementById('theme-toggle');
const themes = ['default', 'light', 'dark'];
let themeIndex = 0;
let currentUser = '';

themeToggle.addEventListener('click', () => {
  themeIndex = (themeIndex + 1) % themes.length;
  const theme = themes[themeIndex];
  document.body.setAttribute('data-theme', theme);
  themeToggle.lastElementChild.textContent = theme.charAt(0).toUpperCase() + theme.slice(1);
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('chat_username');
  localStorage.removeItem('chat_token');
  location.reload();
});

function setStatus(msg, color = '#c084fc') {
  statusEl.textContent = msg;
  statusEl.style.color = color;
}

function register() {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value;
  if (!u || !p) return setStatus('Fill both fields', '#ef4444');
  socket.emit('register', { username: u, password: p });
  setStatus('Registering...', '#c084fc');
}

function login() {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value;
  if (!u || !p) return setStatus('Fill both fields', '#ef4444');
  socket.emit('login', { username: u, password: p });
  setStatus('Connecting...', '#c084fc');
}

// Auto-login on page load/refresh
window.addEventListener('load', () => {
  const savedUser = localStorage.getItem('chat_username');
  const savedToken = localStorage.getItem('chat_token');

  if (savedUser && savedToken) {
    setStatus('Reconnecting...', '#c084fc');
    socket.emit('auto_login', { username: savedUser, token: savedToken });
  }
});

// Socket events
socket.on('auth_error',   msg => setStatus(msg, '#ef4444'));
socket.on('auth_success', msg => setStatus(msg, '#c084fc'));

socket.on('login_success', (history, token) => {
  currentUser = document.getElementById('user').value.trim();

  // Save for persistent login
  localStorage.setItem('chat_username', currentUser);
  localStorage.setItem('chat_token', token);

  setStatus('Connected!', '#c084fc');
  setTimeout(() => statusEl.textContent = '', 1400);

  loginCard.style.display = 'none';
  chatCard.style.display = 'flex';
  chatCard.style.flexDirection = 'column';

  chatDiv.innerHTML = '';
  if (Array.isArray(history)) history.forEach(addMessage);

  msgInput.focus();
});

socket.on('auto_login_success', (history) => {
  currentUser = localStorage.getItem('chat_username');

  setStatus('Welcome back!', '#c084fc');
  setTimeout(() => statusEl.textContent = '', 1400);

  loginCard.style.display = 'none';
  chatCard.style.display = 'flex';
  chatCard.style.flexDirection = 'column';

  chatDiv.innerHTML = '';
  if (Array.isArray(history)) history.forEach(addMessage);

  msgInput.focus();
});

socket.on('auto_login_failed', (msg) => {
  setStatus(msg || 'Session expired. Please log in.', '#ef4444');
  localStorage.removeItem('chat_token');
  // Keep username in field for convenience
  const saved = localStorage.getItem('chat_username');
  if (saved) document.getElementById('user').value = saved;
});

socket.on('message', addMessage);

function addMessage(m) {
  if (!m?.user || !m?.text) return;

  const div = document.createElement('div');
  div.classList.add('msg');
  div.classList.add(m.user === currentUser ? 'self' : 'other');

  div.innerHTML = `
    <span class="user">${m.user}</span>:
    ${m.text}
    <span class="time">[${m.time || new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}]</span>
  `;

  chatDiv.appendChild(div);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

function send() {
  const text = msgInput.value.trim();
  if (!text) return;
  socket.emit('message', text);
  msgInput.value = '';
  msgInput.focus();
}

msgInput.addEventListener('keypress', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
